<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mastara — 3D Menu</title>
<meta name="description" content="Scan, tap, and see every Mastara dish in 3D on your own table — then send your order straight to the kitchen. Rooftop dining at Galleria Mall, I-8 Markaz, Islamabad.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/logo.webp">
<meta property="og:type" content="website">
<meta property="og:title" content="Mastara — 3D Menu">
<meta property="og:description" content="Scan, tap, and see every Mastara dish in 3D on your own table.">
<meta property="og:image" content="img/hero-1600.webp">

<link rel="preload" href="fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/raleway.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" fetchpriority="high" href="img/hero-900.webp"
      imagesrcset="img/hero-900.webp 900w, img/hero-1600.webp 1600w" imagesizes="100vw">
<link rel="preload" href="menu.js" as="script">

<style>
@font-face{font-family:Oswald;src:url(fonts/oswald.woff2) format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:Raleway;src:url(fonts/raleway.woff2) format("woff2");font-weight:100 900;font-display:swap}

:root{
  --red:#d32f23; --red-dark:#b52419; --red-light:#e54a3f;
  --black:#000; --g1:#0c0c0c; --g2:#1a1a1a; --g3:#2a2a2a;
  --white:#fff; --muted:#9a9a9a; --green:#67d38b;
  --head:Oswald,"Arial Narrow",system-ui,sans-serif;
  --body:Raleway,system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(16px,5vw,32px);
  --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--white);font:400 16px/1.6 var(--body);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.has-bar{padding-bottom:78px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--red-light);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--pad)}
.eyebrow{font-family:var(--head);font-weight:500;font-size:12px;letter-spacing:.34em;
         text-transform:uppercase;color:var(--red);margin:0}
h1,h2,h3{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;
        padding:10px var(--pad);background:rgba(0,0,0,.74);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #191919}
.topbar .logo{height:34px;width:auto;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--head);font-size:11px;
      letter-spacing:.16em;text-transform:uppercase;border:1px solid #2c2c2c;color:#cfcfcf;
      padding:6px 11px;border-radius:999px;white-space:nowrap}
.pill.table{border-color:#3a1f1c;color:var(--red-light)}
.pill.cart{background:var(--red);border-color:var(--red);color:#fff}
.pill[hidden]{display:none}
.pill b{font-weight:600}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(62vh,460px);display:grid;align-items:end;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
          animation:slowzoom 18s ease-out forwards}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.35) 42%,#000 100%)}
.hero .inner{position:relative;z-index:2;padding:56px 0 30px}
.hero h1{font-size:clamp(40px,13vw,86px);line-height:.92;letter-spacing:.02em}
.hero h1 span{color:var(--red)}
.hero p{max-width:34ch;color:#d8d8d8;margin:12px 0 0;font-size:15px}
.rise{opacity:0;transform:translateY(22px);animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards}
.rise:nth-child(2){animation-delay:.1s}.rise:nth-child(3){animation-delay:.2s}.rise:nth-child(4){animation-delay:.3s}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes slowzoom{from{transform:scale(1.1)}to{transform:scale(1)}}

/* ---------- marquee ---------- */
.ribbon{border-block:1px solid #1e1e1e;background:var(--g1);overflow:hidden;padding:11px 0}
.ribbon div{display:flex;gap:30px;width:max-content;animation:slide 34s linear infinite;
            font-family:var(--head);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#6d6d6d}
.ribbon b{color:var(--red);font-weight:500}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:55px;z-index:30;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
      padding:12px var(--pad);background:linear-gradient(180deg,#000 62%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--head);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:#8d8d8d;border:1px solid #242424;border-radius:999px;padding:8px 15px;white-space:nowrap;
  transition:color .2s,border-color .2s,background-color .2s}
.tabs button[aria-selected=true]{color:var(--white);background:var(--red);border-color:var(--red)}

/* ---------- grid ---------- */
.count{color:var(--muted);font-size:13px;margin:6px 0 14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));padding-bottom:40px}
.card{position:relative;background:var(--g1);border:1px solid #1d1d1d;border-radius:16px;overflow:hidden;
      display:flex;flex-direction:column;opacity:0;transform:translateY(16px);
      transition:opacity .5s ease,transform .5s ease,border-color .25s}
.card.in{opacity:1;transform:none}
.card:hover{border-color:var(--red)}
.card .shot{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--g2)}
.card .shot img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .shot img{transform:scale(1.06)}
.card .shot::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75) 100%)}
.view3d{position:absolute;z-index:2;right:9px;bottom:9px;display:flex;align-items:center;gap:6px;
  font-family:var(--head);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(211,47,35,.94);padding:5px 9px;border-radius:999px}
.view3d svg{width:12px;height:12px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16.5px;letter-spacing:.03em}
.card p{margin:0;color:var(--muted);font-size:13.2px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--head);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
     border:1px solid #2c2c2c;color:#a5a5a5;border-radius:999px;padding:3px 8px}
.tag.popular{color:#f0c674;border-color:#4a3c1c}
.tag.spicy{color:var(--red-light);border-color:#4a1a16}
.tag.veg{color:var(--green);border-color:#1d4030}
.tag.chefs{color:#e6e6e6;border-color:#3a3a3a}

/* ---------- price + add ---------- */
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.price{font-family:var(--head);font-size:17px;letter-spacing:.02em;color:var(--white);white-space:nowrap}
.add{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
     background:var(--red);padding:9px 15px;border-radius:9px;transition:background-color .2s,transform .08s}
.add:hover{background:var(--red-dark)}
.add:active{transform:scale(.96)}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--red);border-radius:9px;overflow:hidden}
.stepper button{width:36px;height:36px;font-family:var(--head);font-size:18px;line-height:1;
                color:var(--red-light);transition:background-color .15s}
.stepper button:hover{background:rgba(211,47,35,.16)}
.stepper span{min-width:26px;text-align:center;font-family:var(--head);font-size:15px}

/* ---------- dish view ---------- */
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-size:12px;
      letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:18px 0 12px}
.stage{position:relative;border:1px solid #1d1d1d;border-radius:20px;overflow:hidden;background:var(--g1)}
.stage model-viewer,.stage .fallback{width:100%;height:min(56vh,430px);display:block;
  --poster-color:transparent;background:radial-gradient(120% 80% at 50% 12%,#232323 0%,#0a0a0a 70%)}
.stage .fallback{object-fit:cover}
.spin{position:absolute;left:50%;translate:-50% 0;bottom:12px;margin:0;white-space:nowrap;
      background:rgba(0,0,0,.55);padding:4px 11px;border-radius:999px;backdrop-filter:blur(4px);
      font-family:var(--head);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
      color:#9a9a9a;pointer-events:none}
.dish{padding:20px 0 8px}
.dish .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.dish h2{font-size:clamp(26px,7vw,40px);line-height:1.05}
.dish .price{font-size:24px;color:var(--red-light)}
.dish p.desc{color:#c9c9c9;margin:10px 0 0;font-size:15.5px;max-width:58ch}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px;align-items:stretch}
.btn{flex:1 1 190px;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;
  font-family:var(--head);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:15px 18px;border-radius:12px;border:1px solid #2a2a2a;background:var(--g1);
  transition:background-color .2s,border-color .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:hover{background:var(--red-dark)}
.btn.wa{border-color:#1f4d33;color:var(--green)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.bigstep{flex:1 1 190px;display:flex;align-items:center;justify-content:center;gap:14px;
         border:1px solid var(--red);border-radius:12px}
.bigstep button{width:52px;height:100%;font-family:var(--head);font-size:22px;color:var(--red-light)}
.bigstep span{font-family:var(--head);font-size:18px;min-width:28px;text-align:center}
.note{color:#6f6f6f;font-size:12.5px;margin:12px 0 0}
.more{margin:34px 0 10px}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:0 0 148px;scroll-snap-align:start}
.rail img{aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid #1d1d1d;width:100%}
.rail span{display:block;font-family:var(--head);font-size:12px;letter-spacing:.08em;
           text-transform:uppercase;margin-top:7px;color:#cfcfcf}

/* ---------- order view ---------- */
.sheet{background:var(--g1);border:1px solid #1d1d1d;border-radius:18px;
       padding:18px clamp(14px,4vw,24px);margin-bottom:16px}
.sheet h3{font-size:15px;letter-spacing:.12em;margin-bottom:12px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
      padding:13px 0;border-bottom:1px solid #1b1b1b}
.line:last-of-type{border-bottom:0}
.line .who{min-width:0}
.line .who b{display:block;font-family:var(--head);font-weight:500;font-size:15px;letter-spacing:.03em}
.line .who small{color:var(--muted);font-size:12.5px}
.line .amt{font-family:var(--head);font-size:15px;min-width:88px;text-align:right}
.totals{margin-top:14px;padding-top:14px;border-top:1px dashed #2a2a2a}
.totals div{display:flex;justify-content:space-between;gap:12px;color:#bdbdbd;font-size:14px;padding:3px 0}
.totals div.grand{color:var(--white);font-family:var(--head);font-size:21px;letter-spacing:.04em;
                  padding-top:10px;margin-top:6px;border-top:1px solid #232323}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--head);font-size:11px;letter-spacing:.18em;
             text-transform:uppercase;color:#8d8d8d;margin-bottom:6px}
.field input,.field textarea{width:100%;background:#000;border:1px solid #2a2a2a;color:var(--white);
  border-radius:10px;padding:13px 14px;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--red);outline:none}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.errors{background:rgba(211,47,35,.12);border:1px solid #4a1a16;border-radius:10px;padding:11px 14px;
        margin-bottom:14px;color:#ffb3ad;font-size:13.5px}
.errors p{margin:2px 0}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-size:22px;margin-bottom:10px;color:var(--white)}

/* ---------- confirmation ---------- */
.done{text-align:center;padding:26px 0 6px}
.done .mark{width:66px;height:66px;margin:0 auto 16px;border-radius:50%;background:rgba(103,211,139,.14);
            border:1px solid #1f4d33;display:grid;place-items:center}
.done .mark svg{width:30px;height:30px;color:var(--green)}
.done h2{font-size:clamp(24px,6vw,34px)}
.done .oid{font-family:var(--head);letter-spacing:.2em;color:var(--red-light);margin-top:6px;font-size:14px}
.ticket{white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
        background:#000;border:1px dashed #2e2e2e;border-radius:12px;padding:16px;color:#cfcfcf;
        text-align:left;margin-top:18px;overflow-x:auto}

/* ---------- sticky cart bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px var(--pad);
     padding-bottom:calc(10px + env(safe-area-inset-bottom));
     background:rgba(10,10,10,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
     border-top:1px solid #242424;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.bar.show{transform:none}
.bar a{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:14px;
       background:var(--red);border-radius:13px;padding:13px 18px}
.bar .n{font-family:var(--head);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bar .t{margin-left:auto;font-family:var(--head);font-size:18px}

/* ---------- footer ---------- */
footer{border-top:1px solid #171717;margin-top:42px;padding:30px 0 44px;background:var(--g1)}
footer .cols{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{font-family:var(--head);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
          color:var(--red);margin:0 0 8px;font-weight:500}
footer p,footer a{color:#a8a8a8;font-size:13.6px;margin:0 0 4px}
footer a:hover{color:var(--white)}
.legal{color:#5a5a5a;font-size:11.5px;margin-top:24px;letter-spacing:.04em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                        transition-duration:.01ms!important}
  .card{opacity:1;transform:none}
  .bar{transform:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="./" aria-label="Mastara home"><img class="logo" src="img/logo.webp" alt="Mastara — Bite &amp; Bubbles" width="146" height="34" fetchpriority="high"></a>
  <button class="pill table" id="tablePill" hidden>Table —</button>
  <a class="pill cart" id="cartPill" href="?view=order" hidden>Order <b>0</b></a>
</header>

<main id="app"></main>

<div class="bar" id="bar">
  <a href="?view=order">
    <span class="n" id="barCount">0 items</span>
    <span class="t" id="barTotal"></span>
    <span class="n">Review →</span>
  </a>
</div>

<footer>
  <div class="wrap cols" id="foot"></div>
</footer>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="order.js"></script>
<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const bySlug = s => MENU.find(d => d.slug === s);
const catLabel = id => CATEGORIES.find(c => c.id === id).label;
let activeCat = "desi";
let mvLoaded = null;
let lastOrder = null;

const ICON_CUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.6 21 7.4v9.2L12 21.4 3 16.6V7.4z"/><path d="M3 7.4 12 12l9-4.6M12 12v9.4"/></svg>';
const ICON_WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 1c.2.1.4.2.4.3.1.2.1.7-.1 1.4Z"/></svg>';
const ICON_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.2 5L20 6.5"/></svg>';

/* ------------------------------------------------------------- cart chrome */
function buyHTML(slug) {
  const qty = Cart.qtyOf(slug);
  if (!qty) return `<button class="add" data-add="${slug}">+ Add</button>`;
  return `<span class="stepper">
    <button data-dec="${slug}" aria-label="One less ${esc(bySlug(slug).name)}">−</button>
    <span>${qty}</span>
    <button data-inc="${slug}" aria-label="One more ${esc(bySlug(slug).name)}">+</button></span>`;
}

function bigBuyHTML(slug) {
  const qty = Cart.qtyOf(slug);
  if (!qty) return `<button class="btn primary" data-add="${slug}" style="flex:1 1 190px">Add to order</button>`;
  return `<span class="bigstep">
    <button data-dec="${slug}" aria-label="One less">−</button>
    <span>${qty} in order</span>
    <button data-inc="${slug}" aria-label="One more">+</button></span>`;
}

function syncCartUI() {
  const n = Cart.count();
  const total = Cart.totals().total;
  const view = new URLSearchParams(location.search).get("view");

  const pill = document.getElementById("cartPill");
  pill.hidden = !n || !CONFIG.orderingEnabled;
  pill.querySelector("b").textContent = n;

  const tablePill = document.getElementById("tablePill");
  tablePill.hidden = !CONFIG.orderingEnabled;
  tablePill.textContent = Table.get() ? `Table ${Table.get()}` : "Set table";

  const bar = document.getElementById("bar");
  const show = n > 0 && CONFIG.orderingEnabled && view !== "order" && view !== "sent";
  bar.classList.toggle("show", show);
  document.body.classList.toggle("has-bar", show);
  document.getElementById("barCount").textContent = `${n} item${n === 1 ? "" : "s"}`;
  document.getElementById("barTotal").textContent = total ? money(total) : "";

  // repaint every add/stepper control currently on screen
  app.querySelectorAll("[data-buy]").forEach(el => {
    const html = el.dataset.big ? bigBuyHTML(el.dataset.buy) : buyHTML(el.dataset.buy);
    if (el.dataset.state !== html) { el.innerHTML = html; el.dataset.state = html; }
  });
}

document.getElementById("tablePill").onclick = () => {
  const answer = prompt("Which table are you sitting at?", Table.get());
  if (answer !== null) Table.set(answer);
  syncCartUI();
};

/* one handler for every + / − / Add / remove in the page */
app.addEventListener("click", e => {
  const add = e.target.closest("[data-add]"), inc = e.target.closest("[data-inc]"),
        dec = e.target.closest("[data-dec]"), del = e.target.closest("[data-del]");
  if (!add && !inc && !dec && !del) return;
  e.preventDefault();
  if (add) Cart.add(add.dataset.add);
  if (inc) Cart.add(inc.dataset.inc);
  if (dec) Cart.setQty(dec.dataset.dec, Cart.qtyOf(dec.dataset.dec) - 1);
  if (del) Cart.remove(del.dataset.del);
  if (new URLSearchParams(location.search).get("view") === "order") renderOrder();
});

Cart.onChange(syncCartUI);

/* ------------------------------------------------------------------ menu */
function cardHTML(d) {
  const buy = d.price > 0
    ? `<div class="buy"><span class="price">${money(d.price)}</span>
        ${CONFIG.orderingEnabled ? `<span data-buy="${d.slug}">${buyHTML(d.slug)}</span>` : ""}</div>`
    : "";
  return `<article class="card">
    <a class="shot" href="?d=${d.slug}" aria-label="${esc(d.name)} in 3D">
      <img src="img/${d.img}-560.webp"
           srcset="img/${d.img}-560.webp 560w, img/${d.img}-1200.webp 1200w"
           sizes="(max-width:640px) 92vw, 300px"
           alt="${esc(d.name)}" width="560" height="420" loading="lazy" decoding="async">
      <span class="view3d">${ICON_CUBE} View in 3D</span>
    </a>
    <div class="body">
      <a href="?d=${d.slug}"><h3>${esc(d.name)}</h3></a>
      <p>${esc(d.desc)}</p>
      <div class="tags">${d.badges.map(b =>
        `<span class="tag ${b}">${BADGES[b].mark} ${BADGES[b].label}</span>`).join("")}</div>
      ${buy}
    </div>
  </article>`;
}

function renderMenu() {
  document.title = "Mastara — 3D Menu";
  const cat = CATEGORIES.find(c => c.id === activeCat);
  const dishes = MENU.filter(d => d.cat === activeCat);
  app.innerHTML = `
    <section class="hero">
      <img src="img/hero-900.webp" srcset="img/hero-900.webp 900w, img/hero-1600.webp 1600w"
           sizes="100vw" alt="" width="900" height="900" fetchpriority="high" decoding="async">
      <div class="inner wrap">
        <p class="eyebrow rise">Rooftop · Islamabad</p>
        <h1 class="rise">Our <span>Menu</span></h1>
        <p class="rise">${CONFIG.orderingEnabled
          ? "See any dish in 3D, add it to your order, and send it straight to the kitchen."
          : "Tap any dish to spin it in 3D — then place it on your table in augmented reality."}</p>
      </div>
    </section>

    <div class="ribbon" aria-hidden="true"><div id="ribbon"></div></div>

    <nav class="tabs" role="tablist" aria-label="Cuisine">
      ${CATEGORIES.map(c => `<button role="tab" data-cat="${c.id}"
        aria-selected="${c.id === activeCat}">${c.label}</button>`).join("")}
    </nav>

    <div class="wrap">
      <p class="count">${cat.tagline} — ${dishes.length} dishes</p>
      <div class="grid">${dishes.map(cardHTML).join("")}</div>
    </div>`;

  const words = ["Rooftop Dining", "100% Halal", "Live BBQ Station", "Panoramic Views",
                 "Desi", "Thai", "Chinese", "Fast Food", "Continental", "Live Qawali"];
  const strip = words.map(w => `<span>${w}</span><b>✦</b>`).join("");
  document.getElementById("ribbon").innerHTML = strip + strip;

  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    activeCat = b.dataset.cat;
    renderMenu();
    syncCartUI();
    document.querySelector(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  reveal();
}

function reveal() {
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); obs.unobserve(e.target); } });
  }, { rootMargin: "80px" });
  app.querySelectorAll(".card").forEach((c, i) => {
    c.style.transitionDelay = (i % 6) * 45 + "ms";
    io.observe(c);
  });
}

/* ------------------------------------------------------------------ dish */
async function renderDish(d) {
  document.title = `${d.name} — Mastara 3D Menu`;
  const related = MENU.filter(x => x.cat === d.cat && x.slug !== d.slug).slice(0, 8);

  app.innerHTML = `<div class="wrap">
    <a class="back" href="./">← All dishes</a>
    <div class="stage">
      <img class="fallback" id="poster" src="img/${d.img}-1200.webp" alt="${esc(d.name)}" width="1200" height="1200">
      <p class="spin">Loading 3D…</p>
    </div>
    <div class="dish">
      <p class="eyebrow">${catLabel(d.cat)}</p>
      <div class="head">
        <h2>${esc(d.name)}</h2>
        ${d.price > 0 ? `<span class="price">${money(d.price)}</span>` : ""}
      </div>
      <div class="tags">${d.badges.map(b =>
        `<span class="tag ${b}">${BADGES[b].mark} ${BADGES[b].label}</span>`).join("")}</div>
      <p class="desc">${esc(d.desc)}</p>
      <div class="btns">
        <button class="btn primary" id="ar">${ICON_CUBE} View on my table</button>
        ${CONFIG.orderingEnabled && d.price > 0
          ? `<span data-buy="${d.slug}" data-big="1" style="display:flex;flex:1 1 190px">${bigBuyHTML(d.slug)}</span>`
          : `<a class="btn wa" href="https://wa.me/${VENUE.whatsapp}" target="_blank" rel="noopener">${ICON_WA} WhatsApp us</a>`}
      </div>
      <p class="note">Augmented reality works on most phones — Android (Chrome) and iPhone (Safari). On a laptop you can still drag to spin the dish.</p>
    </div>
    ${related.length ? `<div class="more">
      <p class="eyebrow">More ${catLabel(d.cat).toLowerCase()}</p>
      <div class="rail">${related.map(r => `<a href="?d=${r.slug}">
        <img src="img/${r.img}-560.webp" alt="${esc(r.name)}" width="560" height="560" loading="lazy" decoding="async">
        <span>${esc(r.name)}</span></a>`).join("")}</div></div>` : ""}
  </div>`;

  syncCartUI();

  mvLoaded ||= import("https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js");
  await mvLoaded;
  if (bySlug(new URLSearchParams(location.search).get("d")) !== d) return;   // guest already moved on

  const mv = document.createElement("model-viewer");
  Object.entries({
    src: `models/${d.model}.glb`,
    alt: `3D model of ${d.name}`,
    poster: `img/${d.img}-1200.webp`,
    "camera-controls": "", "touch-action": "pan-y",
    "auto-rotate": "", "auto-rotate-delay": "600", "rotation-per-second": "22deg",
    "camera-orbit": "25deg 65deg 0.78m", "min-camera-orbit": "auto 0deg 0.4m",
    "max-camera-orbit": "auto 95deg 1.6m", "field-of-view": "30deg",
    "shadow-intensity": "1.1", "shadow-softness": "0.8", exposure: "1.05",
    "environment-image": "neutral", "interaction-prompt": "none",
    ar: "", "ar-modes": "webxr scene-viewer quick-look", "ar-placement": "floor", "ar-scale": "fixed",
  }).forEach(([k, v]) => mv.setAttribute(k, v));
  mv.innerHTML = '<button slot="ar-button" hidden></button>';

  const stage = app.querySelector(".stage");
  stage.querySelector("#poster")?.remove();
  stage.prepend(mv);
  const spin = stage.querySelector(".spin");
  const ar = document.getElementById("ar");
  ar.onclick = () => mv.activateAR();

  // canActivateAR is only meaningful once the model is in — until then, assume AR works.
  mv.addEventListener("load", () => {
    spin.textContent = "Drag to spin · pinch to zoom";
    if (!mv.canActivateAR) {
      ar.innerHTML = ICON_CUBE + " AR needs a phone";
      ar.disabled = true;
      ar.classList.remove("primary");
    }
  }, { once: true });
  mv.addEventListener("error", () => spin.textContent = "3D unavailable", { once: true });
}

/* ----------------------------------------------------------------- order */
function renderOrder(problems = []) {
  document.title = "Your order — Mastara";
  const lines = Cart.lines();
  const t = Cart.totals();

  if (!lines.length) {
    app.innerHTML = `<div class="wrap"><a class="back" href="./">← Menu</a>
      <div class="empty"><h2>Nothing added yet</h2>
        <p>Browse the menu and tap <b>Add</b> on anything you fancy.</p>
        <p style="margin-top:20px"><a class="btn primary" style="display:inline-flex" href="./">See the menu</a></p>
      </div></div>`;
    syncCartUI();
    return;
  }

  app.innerHTML = `<div class="wrap">
    <a class="back" href="./">← Add more dishes</a>
    <h2 style="font-size:clamp(24px,6vw,34px);margin-bottom:4px">Your order</h2>
    <p class="count">Check it over, then send it to the kitchen.</p>

    ${problems.length ? `<div class="errors" role="alert">${problems.map(p => `<p>${esc(p)}</p>`).join("")}</div>` : ""}

    <div class="sheet">
      ${lines.map(l => `<div class="line">
        <div class="who"><b>${esc(l.name)}</b><small>${catLabel(l.category)} · ${money(l.unitPrice)} each</small></div>
        <span data-buy="${l.slug}">${buyHTML(l.slug)}</span>
        <span class="amt">${money(l.lineTotal)}</span>
      </div>`).join("")}
      <div class="totals">
        <div><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
        ${t.tax ? `<div><span>Tax (${t.taxPercent}%)</span><span>${money(t.tax)}</span></div>` : ""}
        ${t.service ? `<div><span>Service (${t.servicePercent}%)</span><span>${money(t.service)}</span></div>` : ""}
        <div class="grand"><span>Total</span><span>${money(t.total)}</span></div>
      </div>
    </div>

    <div class="sheet">
      <h3>Where to bring it</h3>
      <div class="field">
        <label for="fTable">Table number${CONFIG.requireTable ? "" : " (optional)"}</label>
        <input id="fTable" inputmode="numeric" autocomplete="off" maxlength="6"
               value="${esc(Table.get())}" placeholder="e.g. 7">
      </div>
      <div class="two">
        <div class="field"><label for="fName">Your name (optional)</label>
          <input id="fName" autocomplete="name" maxlength="60" placeholder="So we can call you"></div>
        <div class="field"><label for="fPhone">Phone (optional)</label>
          <input id="fPhone" type="tel" autocomplete="tel" maxlength="20" placeholder="03xx xxxxxxx"></div>
      </div>
      <div class="field"><label for="fNote">Anything for the kitchen?</label>
        <textarea id="fNote" maxlength="400" placeholder="Less spicy, no onions, one extra plate…"></textarea></div>
    </div>

    <div class="btns" style="margin-bottom:40px">
      <button class="btn primary" id="send">Send order to kitchen</button>
      <a class="btn ghost" href="./">Keep browsing</a>
    </div>
  </div>`;

  syncCartUI();

  const tableInput = document.getElementById("fTable");
  tableInput.addEventListener("change", () => { Table.set(tableInput.value); syncCartUI(); });

  document.getElementById("send").onclick = async e => {
    const btn = e.currentTarget;
    const guest = { name: document.getElementById("fName").value, phone: document.getElementById("fPhone").value };
    const note = document.getElementById("fNote").value;
    const table = Table.set(tableInput.value);

    const found = Order.problems({ table, guest });
    if (found.length) { renderOrder(found); scrollTo({ top: 0, behavior: "smooth" }); return; }

    btn.disabled = true;
    btn.textContent = "Sending…";
    const payload = Order.build({ table, guest, note });
    const result = await Order.send(payload);
    lastOrder = { payload, result };
    Cart.clear();
    history.pushState({}, "", `?view=sent&o=${payload.orderId}`);
    renderSent();
  };
}

function renderSent() {
  document.title = "Order sent — Mastara";
  const saved = lastOrder || (() => {
    const id = new URLSearchParams(location.search).get("o");
    const found = Order.history().find(o => o.orderId === id);
    return found ? { payload: found, result: { ok: true, via: found.status === "sent" ? "endpoint" : "local" } } : null;
  })();

  if (!saved) { history.replaceState({}, "", "./"); renderMenu(); syncCartUI(); return; }

  const { payload, result } = saved;
  const delivered = result.ok && result.via === "endpoint";

  app.innerHTML = `<div class="wrap">
    <div class="done">
      <div class="mark">${ICON_TICK}</div>
      <h2>${delivered ? "Order sent" : "Order saved"}</h2>
      <p class="oid">${esc(payload.orderId)}</p>
      <p class="note" style="margin-top:14px">${delivered
        ? `The kitchen has your order for <b>table ${esc(payload.table)}</b>. A waiter will confirm shortly.`
        : `Tap below to send it to the kitchen on WhatsApp — or just show this screen to your waiter.`}</p>
      <div class="ticket">${esc(Order.ticketText(payload))}</div>
      <div class="btns">
        ${!delivered && CONFIG.whatsappFallback
          ? `<a class="btn primary" href="${Order.whatsappLink(payload)}" target="_blank" rel="noopener">${ICON_WA} Send on WhatsApp</a>`
          : ""}
        <a class="btn ghost" href="./">Order something else</a>
      </div>
      ${result.error ? `<p class="note">Saved on this device — the kitchen system didn't answer (${esc(result.error)}). It will resend by itself.</p>` : ""}
    </div>
  </div>`;
  syncCartUI();
}

/* --------------------------------------------------------- footer + routing */
function renderFooter() {
  document.getElementById("foot").innerHTML = `
    <div><h4>Mastara</h4><p>${esc(VENUE.tagline)}</p><p>${esc(VENUE.blurb)}</p></div>
    <div><h4>Find us</h4><p>${esc(VENUE.address)}</p><p><a href="tel:+${VENUE.whatsapp}">${esc(VENUE.phone)}</a></p></div>
    <div><h4>Hours</h4><p>${esc(VENUE.hours)}</p><p>100% Halal certified</p></div>
    <div><h4>Links</h4>
      <p><a href="${VENUE.site}" target="_blank" rel="noopener">mastararestaurants.com</a></p>
      <p><a href="${VENUE.instagram}" target="_blank" rel="noopener">@mastaraislamabad</a></p>
      <p><a href="https://wa.me/${VENUE.whatsapp}" target="_blank" rel="noopener">WhatsApp us</a></p></div>
    <p class="legal">Sample 3D menu — dish models are generated from Mastara photography.</p>`;
}

function route() {
  const q = new URLSearchParams(location.search);
  if (q.get("t")) Table.set(q.get("t"));            // arrived from a table QR code

  const view = q.get("view");
  const dish = q.get("d") && bySlug(q.get("d"));

  if (view === "order" && CONFIG.orderingEnabled) renderOrder();
  else if (view === "sent") renderSent();
  else if (dish) { activeCat = dish.cat; renderDish(dish); }
  else renderMenu();

  syncCartUI();
  scrollTo({ top: 0, behavior: "instant" });
}

addEventListener("click", e => {
  const a = e.target.closest("a[href^='?'], a[href='./']");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  history.pushState({}, "", a.getAttribute("href"));
  document.startViewTransition ? document.startViewTransition(route) : route();
});
addEventListener("popstate", route);

renderFooter();
route();
Order.flushQueue();
</script>
</body>
</html>
